name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest version the l402-compatibility-report scripts promise.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The skill-format and tool-surface guards are stdlib-only; the only
      # dependency is pytest itself.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Run exactly as documented in the repo: `pytest` from the root, which
      # reads pytest.ini (testpaths = tests). The suite checks each skill's
      # frontmatter and links, and pins every skill to the MCP 2.x tool names.
      - name: Run tests
        run: python -m pytest
